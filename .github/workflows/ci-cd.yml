name: Nexus Paste CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================
  # 1. Test Backend
  # ==========================================

  backend-test:
    name: Backend Tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: |
          pytest


  # ==========================================
  # 2. Build Frontend
  # ==========================================

  frontend-build:
    name: Frontend Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build


  # ==========================================
  # 3. Build & Push Docker Images
  # ==========================================

  docker-build:
    name: Build Docker Images

    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/vivek0306/nexus-paste-backend:latest
            ghcr.io/vivek0306/nexus-paste-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ghcr.io/vivek0306/nexus-paste-frontend:latest
            ghcr.io/vivek0306/nexus-paste-frontend:${{ github.sha }}


  # ==========================================
  # 4. Deploy to Nexus
  # ==========================================

  deploy:
    name: Deploy to Nexus

    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      # tailscale tag updated
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: 100.73.244.120

      - name: Deploy to Nexus
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.NEXUS_HOST }}
          username: ${{ secrets.NEXUS_USER }}
          key: ${{ secrets.NEXUS_SSH_KEY }}
          script: |
            cd /home/kamikaze/homelab/apps/nexus-paste

            export IMAGE_TAG=${{ github.sha }}

            docker compose pull

            docker compose up -d

            docker image prune -f